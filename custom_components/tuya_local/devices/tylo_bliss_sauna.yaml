# Tylo Bliss sauna (Sauna360; Tylo/Helo/Finnleo). Schema read from the Tuya
# OEM app's SDK, as it cannot be linked to a Tuya IoT project. dp 110
# operation_mode reads 60min on this unit, capping runs at one hour.
name: Sauna
products:
  - id: d3hy0cu1zqxr28q5
    manufacturer: Tylo
    model: Bliss
entities:
  - entity: climate
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 122
        type: integer
        name: temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: F
                range:
                  min: 119
                  max: 194
        range:
          min: 48
          max: 90
      - id: 3
        type: integer
        name: current_temperature
      - id: 107
        type: string
        name: temperature_unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
      - id: 11
        type: bitfield
        name: fault
        optional: true
  - entity: number
    name: Traditional setpoint F
    class: temperature
    category: config
    hidden: true
    dps:
      - id: 111
        type: integer
        name: value
        range:
          min: 119
          max: 194
  - entity: select
    name: Sauna mode
    dps:
      - id: 108
        type: string
        name: option
        mapping:
          - dps_val: "NONE"
            value: "off"
          - dps_val: TRAD
            value: traditional
          - dps_val: IR
            value: infrared
  - entity: number
    name: Infrared setpoint
    class: temperature
    category: config
    dps:
      - id: 121
        type: integer
        name: value
        range:
          min: 28
          max: 65
      - id: 107
        type: string
        name: unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
  - entity: number
    name: Infrared setpoint F
    class: temperature
    category: config
    hidden: true
    dps:
      - id: 120
        type: integer
        optional: true
        name: value
        range:
          min: 84
          max: 149
  - entity: number
    name: Bath time hours
    category: config
    dps:
      - id: 113
        type: integer
        name: value
        range:
          min: 0
          max: 24
  - entity: number
    name: Bath time minutes
    category: config
    dps:
      - id: 114
        type: integer
        name: value
        range:
          min: 0
          max: 60
  - entity: sensor
    name: Time remaining
    class: duration
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: min
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 11
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 11
        type: bitfield
        name: fault_code
  - entity: light
    name: Sauna light
    dps:
      - id: 12
        type: boolean
        name: switch
  - entity: switch
    name: Colour light 1
    dps:
      - id: 127
        type: boolean
        name: switch
  - entity: number
    name: Colour light 1 brightness
    category: config
    dps:
      - id: 123
        type: integer
        name: value
        range:
          min: 0
          max: 100
  - entity: switch
    name: Colour light 1 fade
    category: config
    dps:
      - id: 125
        type: boolean
        name: switch
  - entity: switch
    name: Colour light 2
    dps:
      - id: 128
        type: boolean
        name: switch
  - entity: number
    name: Colour light 2 brightness
    category: config
    dps:
      - id: 124
        type: integer
        name: value
        range:
          min: 0
          max: 100
  - entity: switch
    name: Colour light 2 fade
    category: config
    dps:
      - id: 126
        type: boolean
        name: switch
  - entity: light
    name: Colour light 1 colour
    category: config
    hidden: true
    dps:
      - id: 101
        type: raw
        optional: true
        name: rgbhsv
  - entity: light
    name: Colour light 2 colour
    category: config
    hidden: true
    dps:
      - id: 119
        type: raw
        optional: true
        name: rgbhsv
  - entity: switch
    name: Delayed start
    category: config
    dps:
      - id: 102
        type: boolean
        name: switch
  - entity: number
    name: Delayed start hour
    category: config
    dps:
      - id: 115
        type: integer
        name: value
        range:
          min: 0
          max: 24
  - entity: number
    name: Delayed start minute
    category: config
    dps:
      - id: 116
        type: integer
        name: value
        range:
          min: 0
          max: 59
  - entity: select
    name: Delayed start mode
    category: config
    dps:
      - id: 130
        type: string
        name: option
        mapping:
          - dps_val: TRAD
            value: traditional
          - dps_val: IR
            value: infrared
  - entity: number
    name: Delayed start setpoint
    class: temperature
    category: config
    dps:
      - id: 132
        type: integer
        name: value
        range:
          min: 48
          max: 90
      - id: 107
        type: string
        name: unit
        mapping:
          - dps_val: C
            value: C
          - dps_val: F
            value: F
  - entity: number
    name: Delayed start duration hours
    category: config
    dps:
      - id: 105
        type: integer
        name: value
        range:
          min: 0
          max: 24
  - entity: number
    name: Delayed start duration minutes
    category: config
    dps:
      - id: 106
        type: integer
        name: value
        range:
          min: 0
          max: 60
  - entity: number
    name: Delayed start setpoint C infrared
    category: config
    hidden: true
    dps:
      - id: 118
        type: integer
        optional: true
        name: value
        range:
          min: 28
          max: 65
  - entity: number
    name: Delayed start setpoint F traditional
    category: config
    hidden: true
    dps:
      - id: 131
        type: integer
        optional: true
        name: value
        range:
          min: 119
          max: 194
  - entity: number
    name: Delayed start setpoint F infrared
    category: config
    hidden: true
    dps:
      - id: 133
        type: integer
        optional: true
        name: value
        range:
          min: 84
          max: 149
  - entity: switch
    name: Bluetooth
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    name: Buzzer
    category: config
    dps:
      - id: 137
        type: boolean
        name: switch
  - entity: switch
    name: Haptic
    category: config
    dps:
      - id: 138
        type: boolean
        name: switch
  - entity: select
    name: Time format
    category: config
    dps:
      - id: 112
        type: string
        name: option
        mapping:
          - dps_val: 12Hour
            value: "12 hour"
          - dps_val: 24Hour
            value: "24 hour"
  - entity: sensor
    name: Hour meter
    class: duration
    category: diagnostic
    dps:
      - id: 136
        type: integer
        name: sensor
        unit: h
  - entity: sensor
    name: Brand
    category: diagnostic
    dps:
      - id: 104
        type: string
        name: sensor
  - entity: sensor
    name: Factory mode
    category: diagnostic
    dps:
      - id: 109
        type: string
        name: sensor
  - entity: sensor
    name: Operation mode
    category: diagnostic
    dps:
      - id: 110
        type: string
        name: sensor
  - entity: sensor
    name: Temperature limit mode
    category: diagnostic
    dps:
      - id: 153
        type: string
        optional: true
        name: sensor
